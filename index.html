function calendar(){let days=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];let first=new Date();first.setDate(1);let starts=first.getDay(),cells=Array.from({length:35},(_,i)=>i-starts+1);return `<div class="page-head"><div><h1>Expiry Calendar</h1><p class="sub">August 2026 · trade licences, visas and document follow-ups.</p></div><div class="row"><button class="btn">← Previous</button><button class="btn">Today</button><button class="btn">Next →</button></div></div><div class="card" style="padding:0;overflow:auto"><div style="display:grid;grid-template-columns:repeat(7,1fr);min-width:620px;background:#f8fafc">${days.map(x=>`<b style="padding:11px;text-align:center;font-size:12px;color:#64748b">${x}</b>`).join('')}</div><div class="calendar">${cells.map(day=>{let m=data.documents.filter(d=>iso(d.expiry).getDate()===day).slice(0,2);return `<div class="cal-cell"><span class="cal-day">${day>0&&day<32?day:''}</span>${m.map(d=>`<button class="cal-event" onclick="location.hash='document/${d.id}'">${d.type}: ${d.owner}</button>`).join('')}</div>`}).join('')}</div></div>`}
function renewals(){let stages=['Not Contacted','Reminder Sent','Documents Requested','Under Process','Renewed'];let docs=data.documents.filter(d=>['progress','renewed','urgent','soon','expired'].includes(status(d)[1]));return `<div class="page-head"><div><h1>Renewals</h1><p class="sub">Move documents through the renewal workflow.</p></div><button class="btn primary" onclick="openModal('renewal')">+ Start Renewal</button></div><div class="kanban">${stages.map((st,i)=>{let list=i===3?docs.filter(d=>d.renewal==='Under Process'):i===4?docs.filter(d=>d.renewal==='Renewed'):docs.filter((d,j)=>!d.renewal&&j%3===i%3);return `<div class="kan-col"><div class="row"><span class="kan-title">${st}</span><span class="badge pending">${list.length}</span></div>${list.map(d=>`<div class="renew-card"><h4>${d.owner}</h4><div class="small">${d.type}</div><div class="small">Expires ${fmt(d.expiry)}</div><select onchange="moveRenewal(${d.id},this.value)" style="margin-top:10px;width:100%;border:1px solid #e2e8f0;border-radius:6px;padding:6px"><option>${st}</option><option>Not Contacted</option><option>Reminder Sent</option><option>Documents Requested</option><option>Under Process</option><option>Renewed</option></select></div>`).join('')}</div>`}).join('')}</div>`}

function charts(){let docs=data.documents;new Chart($('#expiryChart'),{type:'doughnut',data:{labels:['Valid','Expiring soon','Expired','Renewal in progress'],datasets:[{data:[docs.filter(d=>status(d)[1]==='valid').length,docs.filter(d=>['soon','urgent'].includes(status(d)[1])).length,docs.filter(d=>status(d)[1]==='expired').length,docs.filter(d=>status(d)[1]==='progress').length],backgroundColor:['#16a34a','#f59e0b','#dc2626','#7c3aed']}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{position:'bottom'}}}});new Chart($('#trendChart'),{type:'bar',data:{labels:['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'],datasets:[{label:'Expiries',data:[11,18,13,22,17,28,18,31,19,14,24,16],backgroundColor:'#2563eb',borderRadius:5}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}}}});new Chart($('#typeChart'),{type:'doughnut',data:{labels:['Visa','Passport','Emirates ID','Insurance','Other'],datasets:[{data:[35,24,17,15,9],backgroundColor:['#2563eb','#7c3aed','#16a34a','#f59e0b','#64748b']}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{position:'bottom'}}}})}function reportChart(){new Chart($('#reportChart'),{type:'bar',data:{labels:['Not contacted','Requested','Under process','Renewed'],datasets:[{data:[7,12,9,46],backgroundColor:['#f59e0b','#2563eb','#7c3aed','#16a34a'],borderRadius:6}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}}}})}
function filterTable(type,q){q=q.toLowerCase();if(type==='companies')$('#companyRows').innerHTML=companyRows(data.companies.filter(c=>Object.values(c).join(' ').toLowerCase().includes(q)));if(type==='customers')$('#customerRows').innerHTML=customerRows(data.customers.filter(c=>Object.values(c).join(' ').toLowerCase().includes(q)));if(type==='documents')$('#documentTable').innerHTML=docTable(data.documents.filter(c=>Object.values(c).join(' ').toLowerCase().includes(q)))}
function openModal(type,extra){let titles={company:'Add Company',customer:'Add Customer',document:'Add Document',followup:'Add Follow-Up',renewal:'Mark Document as Renewed'};$('#modalTitle').textContent=titles[type];let fields={company:[['Company name','name'],['Trade name','trade'],['Industry','industry'],['Trade licence number','licence'],['Emirate','emirate'],['Contact person','contact'],['Phone','phone'],['Email','email'],['Assigned staff','staff']],customer:[['Full name','name'],['Customer type','type'],['Nationality','nationality'],['Company','company'],['Branch','branch'],['Job title','job'],['Phone','phone'],['Passport number','passport'],['Emirates ID','eid']],document:[['Document owner','owner'],['Company','company'],['Document type','type'],['Document number','number'],['Issue date','issue','date'],['Expiry date','expiry','date'],['Branch','branch'],['Assigned staff','staff'],['Renewal cost','cost']],followup:[['Customer','customer'],['Company','company'],['Related document','document'],['Follow-up date','date','date'],['Contact method','method'],['Assigned staff','staff'],['Notes','notes']],renewal:[['New issue date','issue','date'],['New expiry date','expiry','date'],['New document number','number'],['Renewal amount','amount'],['Service charge','charge'],['Notes','notes']]};let vals=type==='followup'&&extra?{customer:extra}:{};$('#modalBody').innerHTML=`<form id="recordForm" data-type="${type}" data-extra="${extra||''}"><div class="form-grid">${fields[type].map((f,i)=>`<div class="field ${f[1]==='notes'?'span2':''}"><label>${f[0]} *</label><input name="${f[1]}" type="${f[2]||'text'}" value="${vals[f[1]]||''}" required></div>`).join('')}</div><div class="row" style="margin-top:16px;justify-content:flex-end"><button type="button" class="btn" onclick="closeModal()">Cancel</button><button class="btn primary" type="submit">Save ${type==='renewal'?'renewal':'record'}</button></div></form>`;$('#modalBackdrop').classList.add('show');$('#recordForm').onsubmit=submitForm;}
function submitForm(e){e.preventDefault();let f=Object.fromEntries(new FormData(e.target)),type=e.target.dataset.type,extra=e.target.dataset.extra;if(type==='company'){data.companies.push({id:Date.now(),name:f.name,industry:f.industry,emirate:f.emirate,licence:f.licence,contact:f.contact,phone:f.phone,staff:f.staff,status:'Active',branches:0,employees:0});toast('Company added successfully')}if(type==='customer'){data.customers.push({id:Date.now(),...f,status:'Active',email:'',visa:'Employment Visa',staff:'Sara Khan'});toast('Customer added successfully')}if(type==='document'){data.documents.push({id:Date.now(),...f,renewal:'',notes:'',staff:f.staff||'Sara Khan'});toast('Document saved and expiry calculated')}if(type==='followup'){data.followups.push({id:Date.now(),customer:f.customer,company:f.company,document:f.document,date:fmt(f.date),staff:f.staff,status:'Pending'});toast('Follow-up added')}if(type==='renewal'){let d=data.documents.find(x=>x.id==extra);if(d){Object.assign(d,{issue:f.issue,expiry:f.expiry,number:f.number,renewal:'Renewed'});toast('Renewal completed successfully')} }save();closeModal();render()}
function closeModal(){$('#modalBackdrop').classList.remove('show')}function toast(x){let e=document.createElement('div');e.className='toast';e.textContent=x;$('#toasts').append(e);setTimeout(()=>e.remove(),3200)}function quickAddMenu(){$('#modalTitle').textContent='Quick Add';$('#modalBody').innerHTML=`<div class="grid" style="grid-template-columns:repeat(2,1fr)">${[['building-2','Add Company','company'],['contact-round','Add Customer','customer'],['users','Add Employee','customer'],['file-plus-2','Add Document','document'],['calendar-plus','Add Follow-Up','followup'],['refresh-cw','Start Renewal','renewal']].map(x=>`<button class="card" style="text-align:left" onclick="openModal('${x[2]}')"><span class="stat-icon"><i data-lucide="${x[0]}"></i></span><b style="display:block;margin-top:11px">${x[1]}</b></button>`).join('')}</div>`;$('#modalBackdrop').classList.add('show');setIcons()}function whatsapp(name,phone,doc,expiry){let msg=`Dear ${name.split(' ')[0]},\n\nYour ${doc} will expire on ${expiry}.\n\nPlease contact us to begin the renewal process and avoid delays.\n\nThank you,\nRenewTrack Business Services`;$('#modalTitle').textContent='WhatsApp Reminder';$('#modalBody').innerHTML=`<p><b>Customer:</b> ${name}<br><b>Mobile:</b> ${phone}<br><b>Document:</b> ${doc}<br><b>Expiry date:</b> ${expiry}</p><div class="field"><label>Message preview</label><textarea id="waText" rows="7">${msg}</textarea></div><div class="row" style="justify-content:flex-end"><button class="btn" onclick="navigator.clipboard.writeText($('#waText').value);toast('Message copied')">Copy Message</button><button class="btn" onclick="toast('Customer marked as contacted');closeModal()">Mark as Contacted</button><a class="btn primary" target="_blank" href="https://wa.me/${phone.replace(/\D/g,'')}?text=${encodeURIComponent(msg)}">Open WhatsApp</a></div>`;$('#modalBackdrop').classList.add('show')}
function startRenewal(id){let d=data.documents.find(x=>x.id===id);d.renewal='Under Process';save();toast('Renewal started — moved to Under Process');location.hash='renewals'}function moveRenewal(id,stage){let d=data.documents.find(x=>x.id===id);if(stage==='Renewed'){openModal('renewal',id);return}d.renewal=stage==='Under Process'?'Under Process':'';save();toast(`Renewal moved to ${stage}`);render()}function openNotification(id){let n=data.notifications.find(x=>x.id===id);n.read=true;save();location.hash=n.target;render()}function markAllRead(){data.notifications.forEach(n=>n.read=true);save();render();toast('All notifications marked as read')}function resetData(){localStorage.removeItem('renewtrack-data');load();toast('Demo data has been restored');location.hash='dashboard';render()}function exportCsv(){let csv='Owner,Company,Document,Expiry Date,Status\n'+data.documents.map(d=>`"${d.owner}","${d.company}","${d.type}","${d.expiry}","${status(d)[0]}"`).join('\n');let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));a.download='renewtrack-documents.csv';a.click();toast('Export prepared')}
$('#loginForm').onsubmit=e=>{e.preventDefault();if($('#loginEmail').value==='admin@renewtrack.ae'&&$('#loginPassword').value==='admin123'){localStorage.setItem('renewtrack-login','true');showApp()}else toast('Use the supplied demo credentials')};function showApp(){$('#login').classList.add('hide');$('#app').classList.remove('hide');render()}if(localStorage.getItem('renewtrack-login')==='true')showApp();$('#logout').onclick=e=>{e.preventDefault();localStorage.removeItem('renewtrack-login');$('#app').classList.add('hide');$('#login').classList.remove('hide')};window.onhashchange=render;document.addEventListener('click',e=>{let b=e.target.closest('[data-page]');if(b)location.hash=b.dataset.page});$('#mobileToggle').onclick=()=>$('#sidebar').classList.toggle('open');$('#closeModal').onclick=closeModal;$('#modalBackdrop').onclick=e=>{if(e.target===$('#modalBackdrop'))closeModal()};document.onkeydown=e=>{if(e.key==='Escape')closeModal()};$('#quickAdd').onclick=quickAddMenu;$('#bell').onclick=()=>location.hash='notifications';$('#globalSearch').oninput=e=>{let q=e.target.value.toLowerCase();if(q.length<2)return;let found=[...data.companies.filter(x=>x.name.toLowerCase().includes(q)).map(x=>['company',x.id,x.name]),...data.customers.filter(x=>x.name.toLowerCase().includes(q)).map(x=>['customer',x.id,x.name]),...data.documents.filter(x=>(x.number+x.owner).toLowerCase().includes(q)).slice(0,4).map(x=>['document',x.id,`${x.type} · ${x.owner}`])];if(found.length){let r=$('#searchResults');r.style.cssText='position:absolute;top:44px;width:100%;background:#fff;border:1px solid #e2e8f0;border-radius:8px;box-shadow:0 8px 18px #0f172a20;z-index:20';r.classList.remove('hide');r.innerHTML=found.map(x=>`<button class="nav-item" style="color:#334155" onclick="location.hash='${x[0]}/${x[1]}';$('#searchResults').classList.add('hide')">${x[2]}</button>`).join('')}};setIcons();
</script></body></html>

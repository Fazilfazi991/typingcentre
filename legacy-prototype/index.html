    *{box-sizing:border-box}
    body{margin:0;font-family:Inter,system-ui,sans-serif;background:var(--bg);color:var(--text);font-size:14px}
    button,input,select,textarea{font:inherit}
    button{cursor:pointer}
    .hide{display:none!important}
    .btn{border:1px solid var(--line);background:var(--surface);color:var(--text);border-radius:8px;padding:9px 12px;font-weight:700;display:inline-flex;align-items:center;gap:8px;min-height:38px}
    .btn:hover{border-color:#cbd5e1;background:#f8fafc}
    .btn.primary{background:var(--primary);border-color:var(--primary);color:#fff}
    .btn.danger{background:var(--red-soft);border-color:var(--red-soft);color:var(--red)}
    .btn.small{padding:7px 9px;min-height:32px;font-size:12px}
    .icon-btn{width:38px;height:38px;border:1px solid var(--line);border-radius:8px;background:#fff;display:grid;place-items:center;color:#475569;position:relative}
    .count{position:absolute;right:-5px;top:-5px;min-width:18px;height:18px;padding:0 4px;border-radius:999px;background:var(--red);color:#fff;font-size:10px;font-weight:800;display:grid;place-items:center;border:2px solid #fff}
    .logo{width:36px;height:36px;border-radius:8px;display:grid;place-items:center;background:var(--primary);color:#fff;font-weight:800}
    .badge{display:inline-flex;align-items:center;border-radius:999px;padding:5px 9px;font-size:12px;font-weight:800}
    .badge.valid,.badge.active{background:var(--green-soft);color:#065f46}.badge.soon,.badge.trial,.badge.pending{background:var(--amber-soft);color:#92400e}
    .badge.expired,.badge.suspended,.badge.urgent{background:var(--red-soft);color:#991b1b}.badge.progress,.badge.business,.badge.pro{background:var(--purple-soft);color:#5b21b6}
    #login{min-height:100vh;display:grid;place-items:center;padding:24px;background:linear-gradient(135deg,#e0f2fe 0%,#f8fafc 45%,#eef2ff 100%)}
    .login-card{width:min(920px,100%);display:grid;grid-template-columns:minmax(300px,390px) 1fr;background:#fff;border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);overflow:hidden}
    .login-form{padding:34px}.brand{display:flex;align-items:center;gap:11px;font-size:23px;font-weight:800;color:var(--navy)}
    .tag{color:var(--muted);line-height:1.6;margin:10px 0 24px}.field{display:grid;gap:7px;margin:14px 0}.field label{font-weight:700;font-size:13px}
    .field input,.field textarea,.search,select{border:1px solid var(--line);border-radius:8px;padding:11px 12px;background:#fff;outline:none;width:100%}
    .field input:focus,.search:focus,select:focus{border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-soft)}
    .demo-panel{padding:34px;background:#f8fafc;border-left:1px solid var(--line)}.demo-panel h2{margin:0 0 8px;color:var(--navy);font-size:20px}
    .demo-account{width:100%;text-align:left;border:1px solid var(--line);background:#fff;border-radius:8px;padding:12px;margin-top:10px;display:flex;align-items:center;justify-content:space-between;gap:12px}
    .demo-account b{display:block}.demo-account span{font-size:12px;color:var(--muted)}
    .app{min-height:100vh;display:flex}.sidebar{width:220px;background:#0f172a;color:#cbd5e1;position:fixed;inset:0 auto 0 0;padding:16px 12px;z-index:20;overflow:auto}
    .sidebar .brand{font-size:19px;color:#fff;padding:2px 8px 18px}.nav-label{font-size:10px;letter-spacing:.12em;text-transform:uppercase;font-weight:800;color:#94a3b8;padding:14px 10px 6px}
    .nav-item{width:100%;border:0;background:transparent;color:#cbd5e1;border-radius:8px;padding:10px;display:flex;align-items:center;gap:10px;font-weight:700;text-align:left;margin:2px 0}
    .nav-item:hover,.nav-item.active{background:rgba(255,255,255,.09);color:#fff}.main{margin-left:220px;min-height:100vh;width:calc(100% - 220px);padding-bottom:24px}
    .topbar{height:64px;background:rgba(255,255,255,.95);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:14px;padding:0 22px;position:sticky;top:0;z-index:10;backdrop-filter:blur(8px)}
    .page-title{min-width:180px}.page-title b{font-size:18px;color:var(--navy)}.page-title span{display:block;font-size:12px;color:var(--muted);margin-top:2px}
    .search-wrap{flex:1;max-width:520px;position:relative}.search{padding-left:38px;background:#f8fafc}.search-wrap>i{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:#64748b}
    .top-actions{margin-left:auto;display:flex;align-items:center;gap:9px}.profile{display:flex;align-items:center;gap:9px}.profile small{display:block;color:var(--muted);font-weight:600}
    .content{padding:22px}.grid{display:grid;gap:14px}.stats{grid-template-columns:repeat(4,minmax(0,1fr))}.admin-stats{grid-template-columns:repeat(4,minmax(0,1fr))}
    .card{background:#fff;border:1px solid var(--line);border-radius:8px;padding:16px}.card h3{margin:0 0 12px;color:var(--navy);font-size:16px}
    .stat-card{padding:15px;text-align:left}.stat-label{font-size:12px;font-weight:800;color:#64748b;text-transform:uppercase}.stat-value{font-size:30px;line-height:1;font-weight:800;color:var(--navy);margin-top:9px}
    .split{grid-template-columns:minmax(0,1.45fr) minmax(300px,.85fr);align-items:start}.section-title{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
    .table-card{padding:0;overflow:hidden}.table-head{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;border-bottom:1px solid var(--line)}
    table{width:100%;border-collapse:collapse}th{font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:#64748b;background:#f8fafc;text-align:left;padding:11px 12px}
    td{padding:11px 12px;border-top:1px solid #f1f5f9;vertical-align:middle}tr:hover td{background:#fafafa}.actions-cell{display:flex;gap:6px;flex-wrap:wrap}
    .follow-list,.activity{display:grid;gap:10px}.follow{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center;border:1px solid #f1f5f9;border-radius:8px;padding:11px}
    .follow.done{opacity:.55}.follow input{width:18px;height:18px;accent-color:var(--primary)}.small{font-size:12px;color:var(--muted)}.compact{font-size:13px}
    .activity-item{border-left:3px solid var(--primary);background:#f8fafc;border-radius:6px;padding:10px 12px}.bars{display:grid;gap:12px}
    .bar-row{display:grid;grid-template-columns:130px 1fr 44px;gap:10px;align-items:center}.bar-track{height:10px;background:#e5e7eb;border-radius:999px;overflow:hidden}.bar-fill{height:100%;background:var(--primary);border-radius:999px}
    .toolbar{display:flex;gap:10px;align-items:center;margin-bottom:14px}.toolbar .search{max-width:340px}.workspace-select{max-width:240px}
    .modal-backdrop{position:fixed;inset:0;background:rgba(15,23,42,.52);display:none;place-items:center;padding:20px;z-index:50}.modal-backdrop.show{display:grid}
    .modal{width:min(560px,100%);max-height:92vh;overflow:auto;background:#fff;border-radius:12px;box-shadow:var(--shadow)}.modal-head{display:flex;justify-content:space-between;align-items:center;padding:16px;border-bottom:1px solid var(--line)}
    .modal-body{padding:16px}.form-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.span2{grid-column:span 2}.toasts{position:fixed;right:18px;bottom:18px;display:grid;gap:10px;z-index:80}
    .toast{background:#0f172a;color:#fff;border-radius:8px;padding:12px 14px;box-shadow:var(--shadow);font-weight:700}.mobile-toggle,.bottom-nav,.fab{display:none}
    #searchResults{position:absolute;top:46px;left:0;right:0;background:#fff;border:1px solid var(--line);border-radius:8px;box-shadow:var(--shadow);padding:8px;z-index:30}
    @media(max-width:1050px){.stats,.admin-stats{grid-template-columns:repeat(2,1fr)}.split{grid-template-columns:1fr}.topbar{gap:10px}.profile div{display:none}}
    @media(max-width:760px){
      .sidebar{transform:translateX(-100%);transition:.2s;width:250px}.sidebar.open{transform:translateX(0)}.main{margin-left:0;width:100%;padding-bottom:70px}
      .mobile-toggle{display:grid}.topbar{height:auto;min-height:62px;padding:10px 12px;flex-wrap:wrap}.page-title{min-width:0;flex:1}.search-wrap{order:3;max-width:none;flex-basis:100%}.quick-text{display:none}
      .content{padding:14px}.stats{grid-template-columns:repeat(2,1fr)}.admin-stats{grid-template-columns:repeat(2,1fr)}.card{padding:13px}.stat-value{font-size:25px}
      table,thead,tbody,tr,th,td{display:block}thead{display:none}tr{border-top:1px solid var(--line);padding:10px 12px}td{border:0;padding:4px 0}.actions-cell{margin-top:6px}
      .form-grid{grid-template-columns:1fr}.span2{grid-column:auto}.toolbar{flex-wrap:wrap}.toolbar .search{max-width:none}.bottom-nav{display:grid;grid-template-columns:repeat(5,1fr);position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);z-index:25}

      .bar-row{grid-template-columns:95px 1fr 34px}.login-card{grid-template-columns:1fr}.demo-panel{border-left:0;border-top:1px solid var(--line)}
    }
    /* Keep table actions compact: one visible command and one fixed overflow trigger. */
    .table-card .actions-cell{display:flex;align-items:center;justify-content:flex-start;gap:8px;flex-wrap:nowrap;white-space:nowrap}
    .table-card .actions-cell>.btn{flex:0 0 auto}
    .table-card .more-menu{display:block;flex:0 0 34px;width:34px;height:34px;margin:0}
    .table-card .more-menu summary.btn{display:grid;place-items:center;width:34px;height:34px;min-width:34px;min-height:34px;padding:0;line-height:1}
    .table-card .more-menu summary.btn i{width:17px;height:17px}
    @media(max-width:760px){.table-card .actions-cell{padding-top:10px}.table-card .more-menu{flex-basis:34px}}
    /* Note It brand application: shared with the production workspace. */
    :root{--primary:#0e7bff;--primary-soft:#e8f3ff;--navy:#021952;--bg:#f7f9fc;--line:#e5eaf2;--text:#021952;--muted:#667085;--shadow:0 1px 2px rgba(2,25,82,.04),0 8px 24px rgba(2,25,82,.06)}

    .sidebar{background:#fff;color:var(--navy);border-right:1px solid var(--line);box-shadow:0 1px 3px rgba(2,25,82,.03)}
    .sidebar .brand{padding:3px 8px 21px;color:var(--navy)}.sidebar .brand:after{display:none}
    .nav-label{color:#8a94a6}.nav-item{color:#526079;font-weight:600}.nav-item:hover,.nav-item.active{background:var(--primary-soft);color:#0869df}.nav-item.active:before{background:var(--primary)}

    .login-form{background:linear-gradient(145deg,#00144e 0%,#021952 62%,#0b4fa7 100%)}.login-form .brand{color:#fff}.login-form .brand-logo{filter:brightness(0) invert(1)}

<body>
  <section id="login">
    <div class="login-card">
      <div class="login-form">
        <div class="brand"><img class="brand-logo" src="/brand/note-it-logo.png" alt="Note It"></div>
        <p class="tag">A simple document expiry and renewal workspace for UAE typing centres.</p>
        <form id="loginForm">
          <div class="field"><label>Email address</label><input id="loginEmail" type="email" value="owner@alnoortyping.ae" required></div>
          <div class="field"><label>Password</label><input id="loginPassword" type="password" value="Demo@123" required></div>
          <button class="btn primary" style="width:100%;justify-content:center;margin-top:8px" type="submit">Sign in</button>
        </form>
      </div>
      <div class="demo-panel">
        <h2>Try a Demo Workspace</h2>
        <p class="small">Choose an account to fill the sign-in form.</p>
        <div id="demoAccounts"></div>
      </div>
    </div>
  </section>

  <div class="app hide" id="app">
    <aside class="sidebar" id="sidebar">
      <div class="brand"><img class="brand-logo" src="/brand/note-it-logo.png" alt="Note It"></div>
      <div id="nav"></div>
    </aside>
    <main class="main">
      <div class="content" id="content"></div>
    </main>
    <button class="fab" id="mobileFab" aria-label="Quick add"><i data-lucide="plus"></i></button>
    <nav class="bottom-nav" id="bottomNav"></nav>
  </div>
  <div class="modal-backdrop" id="modalBackdrop"><div class="modal"><div class="modal-head"><h2 id="modalTitle">Quick Add</h2><button class="icon-btn" id="closeModal" aria-label="Close"><i data-lucide="x"></i></button></div><div class="modal-body" id="modalBody"></div></div></div>
  <div class="toasts" id="toasts"></div>

  <script>
    if(window.self===window.top)window.location.replace('/demo');
    const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
    const today=new Date('2026-08-05T08:00:00');
    const organizations=[
      {id:'platform',name:'Platform Admin',logo:'PA',color:'#0e7bff',role:'Platform Admin',plan:'Platform',location:'UAE',owner:'Note It HQ',email:'admin@renewtrack.ae',password:'Admin@123'},
      {id:'alnoor',name:'Al Noor Typing Centre',logo:'AN',color:'#2563eb',role:'Owner',plan:'Business',location:'Dubai',owner:'Aisha Rahman',email:'owner@alnoortyping.ae',password:'Demo@123',target:{customers:68,companies:12,documents:184,week:6,month:18,expired:3,followups:5,storage:'12.4 GB'}},
      {id:'smartdocs',name:'Smart Documents Services',logo:'SD',color:'#059669',role:'Owner',plan:'Starter',location:'Sharjah',owner:'Khalid Mansoor',email:'admin@smartdocs.ae',password:'Demo@123',target:{customers:32,companies:6,documents:91,week:2,month:8,expired:1,followups:3,storage:'5.8 GB'}},
      {id:'emirateshub',name:'Emirates Business Hub',logo:'EH',color:'#7c3aed',role:'Owner',plan:'Pro',location:'Abu Dhabi',owner:'Layla Nasser',email:'manager@emirateshub.ae',password:'Demo@123',target:{customers:126,companies:22,documents:368,week:11,month:29,expired:5,followups:8,storage:'24.9 GB'}}
    ];
    const demoAccounts=organizations.filter(o=>o.id!=='platform').map(o=>`<button class="demo-account" onclick="fillDemo('${o.email}','${o.password}')"><span><b>${o.name}</b><span>${o.location} · ${o.plan}</span></span><span class="btn small">Try Demo</span></button>`).join('')+`<button class="demo-account" onclick="fillDemo('admin@renewtrack.ae','Admin@123')"><span><b>Platform Administrator</b><span>Note It HQ</span></span><i data-lucide="arrow-right"></i></button>`;
    $('#demoAccounts').innerHTML=demoAccounts;

    function makeTenant(org){
      const companyNames=['Al Noor Trading LLC','Bright Star Services LLC','Gulf Gate Documents','Metroline Restaurant LLC','Pearl Business Setup','Falcon Technical Services','Sunrise Cleaning LLC','Atlas Cargo LLC','Royal Typing Partner','Nile Star Contracting','Blue Bay Tourism','Desert Link General Trading','Prime PRO Services','Union Auto Care','Green Palm Facilities','Future Line Consulting','Crescent Foods LLC','Vertex Electromech','Marina Fashion LLC','City Care Clinic','Oasis Real Estate','Silver Route Transport'];
      const people=['Ahmed Hassan','Maria Santos','Mohammed Sameer','Fathima Noor','John Mathew','Sara Khan','Ravi Kumar','Nadia Ali','Bilal Ahmed','Amina Yusuf','Peter Joseph','Huda Salem','George Thomas','Imran Malik','Priya Menon','Omar Farooq','Lina Haddad','Yousef Kareem','Ana Cruz','Mahmoud Adel','Nisha Patel','Carlos Reyes'];
      const types=['Residence Visa','Trade Licence','Labour Card','Emirates ID','Passport','Medical Insurance','Establishment Card'];
      const companies=Array.from({length:org.target.companies},(_,i)=>({id:i+1,organization_id:org.id,name:i===0?org.name.replace('Typing Centre','Trading LLC'):companyNames[i%companyNames.length],industry:['General Trading','Technical Services','Food and Beverage','Business Services'][i%4],emirate:org.location,licence:`TL-${org.id.toUpperCase().slice(0,3)}-${784500+i}`,contact:people[(i+3)%people.length],phone:`+971 5${i%6} ${240+i} ${7100+i}`,status:i%7===0?'Renewal Pending':'Active',branches:1+i%3}));
      const customers=Array.from({length:org.target.customers},(_,i)=>({id:i+1,organization_id:org.id,name:i<people.length?people[i]:`${people[i%people.length]} ${i+1}`,type:i%5===0?'Individual':'Employee',nationality:['Egyptian','Indian','Filipino','Pakistani','Jordanian','Sri Lankan'][i%6],company:companies[i%companies.length].name,branch:['Main Office','Branch 1','Branch 2'][i%3],job:['Technician','Sales Executive','Accountant','Supervisor','Driver','Manager'][i%6],phone:`+971 5${i%6} ${980+i} ${6500+i}`,passport:`P${9234100+i}`,eid:`784-199${i%9}-${1234567+i}-${i%9}`,visa:'Employment Visa',status:'Active'}));
      let docs=[], id=1;
      function addDoc(owner,company,type,offset,renewal=''){docs.push({id:id++,organization_id:org.id,owner,company,type,number:`DOC-${org.id.toUpperCase()}-${String(id).padStart(4,'0')}`,issue:dateAfter(offset-365),expiry:dateAfter(offset),renewal,notes:''})}
      for(let i=0;i<org.target.expired;i++)addDoc(customers[i].name,customers[i].company,types[i%types.length],-1-i);
      for(let i=0;i<org.target.week;i++)addDoc(customers[(i+3)%customers.length].name,customers[(i+3)%customers.length].company,types[(i+1)%types.length],(i%7)+1);
      for(let i=0;i<org.target.month-org.target.week;i++)addDoc(customers[(i+9)%customers.length].name,customers[(i+9)%customers.length].company,types[(i+2)%types.length],8+i);
      for(let i=0;i<Math.min(11,org.target.documents);i++)addDoc(customers[(i+15)%customers.length].name,customers[(i+15)%customers.length].company,types[(i+3)%types.length],40+i,'Under Process');
      while(docs.length<org.target.documents)addDoc(customers[docs.length%customers.length].name,customers[docs.length%customers.length].company,types[docs.length%types.length],60+(docs.length%520));
      const followUps=Array.from({length:org.target.followups},(_,i)=>({id:i+1,organization_id:org.id,customer:customers[i].name,company:customers[i].company,document:docs[i].type,time:['9:30 AM','10:45 AM','12:00 PM','2:30 PM','4:15 PM','5:00 PM'][i%6],status:i===1?'Overdue':'Pending',done:false}));
      const notifications=[
        {id:1,organization_id:org.id,text:`${docs[0].owner}'s ${docs[0].type} is expired`,type:'Expired',read:false,target:`document/${docs[0].id}`},
        {id:2,organization_id:org.id,text:`${docs[org.target.expired]?.owner || customers[0].name} needs a renewal call today`,type:'Follow-Up',read:false,target:'followups'},
        {id:3,organization_id:org.id,text:`${org.target.week} documents expire within 7 days`,type:'Urgent',read:false,target:'dashboard'}
      ];
      const activityLogs=[
        {id:1,organization_id:org.id,icon:'message-circle',text:'Visa reminder sent to Ahmed Hassan',time:'12 minutes ago'},
        {id:2,organization_id:org.id,icon:'refresh-cw',text:'Medical insurance renewed for Maria Santos',time:'1 hour ago'},
        {id:3,organization_id:org.id,icon:'user-plus',text:'New customer Ravi Kumar added',time:'Today'},
        {id:4,organization_id:org.id,icon:'file-pen-line',text:'Trade licence updated for Bright Star Services',time:'Yesterday'},
        {id:5,organization_id:org.id,icon:'check-circle-2',text:'Follow-up completed for Mohammed Sameer',time:'Yesterday'}
      ];
      return {companies,customers,documents:docs,followUps,renewals:docs.filter(d=>d.renewal),notifications,activityLogs,reports:[],branches:[],subscriptions:[{id:1,organization_id:org.id,plan:org.plan,status:'Active',storage:org.target.storage}]};
    }
    function dateAfter(days){let d=new Date(today);d.setDate(d.getDate()+days);return d.toISOString().slice(0,10)}
    function defaultStore(){let tenants={};organizations.filter(o=>o.id!=='platform').forEach(o=>tenants[o.id]=makeTenant(o));return {schema:2,tenants,suspended:{smartdocs:false}}}
    function loadStore(){let saved=JSON.parse(localStorage.getItem('renewtrack-store')||'null');return saved?.schema===2?saved:defaultStore()}
    function saveStore(){localStorage.setItem('renewtrack-store',JSON.stringify(store))}
    let store=loadStore(), session=JSON.parse(localStorage.getItem('renewtrack-session')||'null'), previewOrg=null, data={};

    function fillDemo(email,password){$('#loginEmail').value=email;$('#loginPassword').value=password;$('#loginForm').requestSubmit()}
    window.fillDemo=fillDemo;
    function getOrg(id){return organizations.find(o=>o.id===id)}
    function currentAccount(){return session?getOrg(session.orgId):null}
    function getCurrentOrganization(){return session?.role==='Platform Admin'&&previewOrg?getOrg(previewOrg):currentAccount()}
    function getOrganizationRecords(collection){let org=getCurrentOrganization();return org.id==='platform'?[]:(store.tenants[org.id][collection]||[]).filter(r=>r.organization_id===org.id)}
    function switchDemoOrganization(id){previewOrg=id==='platform'?null:id;location.hash='dashboard';render();toast(id==='platform'?'Platform admin view':'Previewing '+getOrg(id).name)}

      let titles={dashboard:session.role==='Platform Admin'&&!previewOrg?'Overview':'Document Overview',centres:'Typing Centres',plans:'Subscription Plans',usage:'Usage',settings:'Settings',customers:'Customers',companies:'Companies',documents:'Documents',renewals:'Renewals',calendar:'Calendar',followups:'Follow-Ups',notifications:'Notifications',reports:'Reports',company:'Company Profile',customer:'Customer Profile',document:'Document Details'};
      $$('.nav-item').forEach(b=>b.classList.toggle('active',b.dataset.page===page));
      let views={dashboard:session.role==='Platform Admin'&&!previewOrg?platformDashboard:tenantDashboard,centres,plans,usage,settings,customers,companies,documents,renewals,calendar,followups,notifications,reports,company,customer,document:documentDetails};

    function platformDashboard(){
      let centreOrgs=organizations.filter(o=>o.id!=='platform'), active=centreOrgs.filter(o=>!store.suspended[o.id]).length, docs=centreOrgs.reduce((n,o)=>n+store.tenants[o.id].documents.length,0);

    window.toggleSuspend=toggleSuspend;

    function tenantData(){let org=getCurrentOrganization();return store.tenants[org.id]}
    function tenantDashboard(){
      data=tenantData();let docs=getOrganizationRecords('documents'), fu=getOrganizationRecords('followUps');
      let expired=docs.filter(d=>daysLeft(d.expiry)<0), week=docs.filter(d=>daysLeft(d.expiry)>=0&&daysLeft(d.expiry)<=7), month=docs.filter(d=>daysLeft(d.expiry)>=0&&daysLeft(d.expiry)<=30);
      let urgent=[...expired,...week].sort((a,b)=>daysLeft(a.expiry)-daysLeft(b.expiry)).slice(0,6);
      let counts=[['Expired',expired.length],['Expiring in 7 Days',week.length],['Expiring in 30 Days',month.length],['Follow-Ups Today',fu.filter(f=>!f.done).length]];
      let dashboardFollowUps=[...fu].sort((a,b)=>({Overdue:0,Pending:1,Completed:2}[a.status]||3)-({Overdue:0,Pending:1,Completed:2}[b.status]||3)).slice(0,5);
      return `${workspaceTools()}<div class="dashboard-intro overview-kpi-heading"><h1>Document Overview</h1><p>Monitor upcoming expiries and renewal actions.</p></div><div class="grid stats overview-kpi-grid">${counts.map(c=>kpiStat(c[0],c[1])).join('')}</div><div class="dashboard-row"><div class="card table-card"><div class="table-head"><span><b>Needs Attention</b><div class="small">Documents that require action soon.</div></span></div>${documentMiniTable(urgent)}</div><div class="card"><div class="section-title"><span><h3>Today's Follow-Ups</h3><div class="small">Customers to contact today</div></span><button class="icon-btn" onclick="openModal('followup')" title="Add Follow-Up" aria-label="Add Follow-Up"><i data-lucide="plus"></i></button></div><div class="follow-list">${dashboardFollowUps.map(f=>followItem(f)).join('')}</div><button class="btn" style="width:100%;justify-content:center;margin-top:10px" onclick="location.hash='followups'">View all ${fu.length} follow-ups</button></div></div>${portfolioDashboard(docs,getOrganizationRecords('activityLogs'))}`
    }
    function workspaceTools(){let org=getCurrentOrganization();return session.role==='Platform Admin'?`<div class="toolbar"><select class="workspace-select" onchange="switchDemoOrganization(this.value)"><option value="${org.id}">Current Workspace: ${org.name}</option><option value="platform">Platform Admin</option>${organizations.filter(o=>o.id!=='platform'&&o.id!==org.id).map(o=>`<option value="${o.id}">${o.name}</option>`).join('')}</select><button class="btn" onclick="resetOrganizationDemoData()">Reset Demo Data</button></div>`:''}
    function stat(label,value){let info={Expired:['circle-alert','summary-expired','Requires action'], 'Expiring in 7 Days':['clock-3','summary-urgent','Contact customers soon'], 'Expiring in 30 Days':['calendar-days','summary-soon','Upcoming renewals'], 'Follow-Ups Today':['list-checks','summary-followups','Scheduled today']}[label]||['circle','', ''];return `<button type="button" class="card stat-card ${info[1]}" onclick="openSummaryCard('${label}')" aria-label="View ${label}"><div class="stat-label">${label}</div><div class="stat-value">${value}</div><div class="stat-support">${info[2]}</div><i data-lucide="${info[0]}" class="stat-icon"></i></button>`}
    function kpiStat(label,value){let info={Expired:['circle-alert','summary-expired','Requires action','View expired documents'], 'Expiring in 7 Days':['clock-3','summary-urgent','Contact customers soon','View next 7 days'], 'Expiring in 30 Days':['calendar-days','summary-soon','Upcoming renewals','View next 30 days'], 'Follow-Ups Today':['list-checks','summary-followups','Scheduled today','View follow-ups']}[label];return `<button type="button" class="card stat-card overview-kpi-card ${info[1]}" onclick="openSummaryCard('${label}')" aria-label="View ${value} ${label}"><span class="overview-kpi-main"><span class="overview-kpi-icon"><i data-lucide="${info[0]}"></i></span><span class="overview-kpi-copy"><span class="stat-label">${label}</span><span class="stat-value">${value}</span><span class="stat-support">${info[2]}</span></span></span><span class="overview-kpi-footer"><span>${info[3]}</span><span class="overview-kpi-arrow" aria-hidden="true">&rarr;</span></span></button>`}
    function daysLeft(v){return Math.ceil((new Date(v)-today)/86400000)}
    function status(d){let n=daysLeft(d.expiry);if(d.renewal==='Under Process')return ['Renewal in Progress','progress'];if(n<0)return ['Expired','expired'];if(n<=7)return ['Urgent','urgent'];if(n<=30)return ['Expiring Soon','soon'];return ['Valid','valid']}
    function expiryTiming(d){let n=daysLeft(d.expiry);if(n<-1)return `Expired ${Math.abs(n)} days ago`;if(n===-1)return 'Expired yesterday';if(n===0)return 'Today';if(n===1)return 'Tomorrow';if(n<=14)return `In ${n} days`;return fmt(d.expiry)}
    function badge(text,kind){return `<span class="badge ${kind}">${text}</span>`}
    function fmt(v){return new Date(v).toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'})}
    function documentMiniTable(list){return `<table><thead><tr><th>Customer / Company</th><th>Document</th><th>Expiry</th><th>Status</th><th>Action</th></tr></thead><tbody>${list.map(d=>{let s=status(d),kind=s[1],primary=kind==='expired'?'Start Renewal':kind==='progress'?'Continue':kind==='valid'?'Open':'Contact';return `<tr><td data-label="Customer"><b>${d.owner}</b><div class="small">${d.company}</div></td><td data-label="Document">${d.type}</td><td data-label="Expiry"><span class="expiry-time">${expiryTiming(d)}</span></td><td data-label="Status">${badge(s[0],kind)}</td><td data-label="Action" class="actions-cell"><button class="btn small primary" onclick="${primary==='Start Renewal'||primary==='Continue'?`startRenewal(${d.id})`:primary==='Contact'?`whatsapp('${d.owner}','+971509876543','${d.type}','${fmt(d.expiry)}')`:`location.hash='document/${d.id}'`}">${primary}</button><details class="more-menu"><summary class="btn small" aria-label="More actions"><i data-lucide="ellipsis"></i></summary><div class="more-menu-items"><button onclick="whatsapp('${d.owner}','+971509876543','${d.type}','${fmt(d.expiry)}')">WhatsApp</button><button onclick="toast('Call task created')">Call</button><button onclick="location.hash='document/${d.id}'">Open Document</button><button onclick="location.hash='customer/${getOrganizationRecords('customers').find(c=>c.name===d.owner)?.id||1}'">View Profile</button><button onclick="toast('Document editor opened')">Edit</button><button onclick="toast('Document archived')">Archive</button></div></details></td></tr>`}).join('')}</tbody></table>`}
    function followItem(f){let initials=f.customer.split(' ').map(x=>x[0]).slice(0,2).join('');let kind=f.status==='Overdue'?'expired':f.status==='Completed'?'active':'pending';return `<label class="follow ${f.done?'done':''}"><span style="display:flex;gap:9px;align-items:center"><span class="logo" style="width:30px;height:30px;font-size:10px;background:var(--primary-soft);color:var(--primary)">${initials}</span><span><b>${f.customer}</b><div class="small">${f.document} · ${f.time}</div>${badge(f.status,kind)}</span></span><input type="checkbox" ${f.done?'checked':''} onchange="completeFollowUp(${f.id},this.checked)"></label>`}
    function expiryBars(docs){let rows=[['Valid',docs.filter(d=>status(d)[1]==='valid').length,'#15803d'],['Expiring Soon',docs.filter(d=>['soon','urgent'].includes(status(d)[1])).length,'#b54708'],['Expired',docs.filter(d=>status(d)[1]==='expired').length,'#b42318'],['Renewal in Progress',docs.filter(d=>status(d)[1]==='progress').length,'#6941c6']],total=Math.max(docs.length,1);return `<div class="health-bar">${rows.map(r=>`<span style="width:${r[1]/total*100}%;background:${r[2]}"></span>`).join('')}</div><div class="health-stats">${rows.map(r=>`<div>${r[0]}<b>${r[1]}</b></div>`).join('')}</div>`}
    function portfolioRows(docs){let rows=[['Valid','valid','shield-check','#099447',docs.filter(d=>status(d)[1]==='valid').length],['Expiring Soon','soon','clock-3','#f47b0b',docs.filter(d=>['soon','urgent'].includes(status(d)[1])).length],['Expired','expired','circle-alert','#dd242b',docs.filter(d=>status(d)[1]==='expired').length],['Renewal in Progress','progress','refresh-cw','#7136d6',docs.filter(d=>status(d)[1]==='progress').length]],total=rows.reduce((n,r)=>n+r[4],0);return {rows,total}}
    function portfolioActivity(a){let text=(a.text+' '+(a.icon||'')).toLowerCase();if(text.includes('follow'))return ['teal','circle-check'];if(text.includes('customer'))return ['purple','user-plus'];if(text.includes('renew'))return ['green','refresh-cw'];if(text.includes('licence')||text.includes('document'))return ['orange','file-pen-line'];return ['blue','message-circle']}
    function portfolioDashboard(docs,activities){let health=portfolioRows(docs),upcoming=[['0–30 days',docs.filter(d=>daysLeft(d.expiry)>=0&&daysLeft(d.expiry)<=30).length],['31–60 days',docs.filter(d=>daysLeft(d.expiry)>=31&&daysLeft(d.expiry)<=60).length],['61–90 days',docs.filter(d=>daysLeft(d.expiry)>=61&&daysLeft(d.expiry)<=90).length]],upcomingTotal=upcoming.reduce((n,r)=>n+r[1],0),max=Math.max(...upcoming.map(r=>r[1]),1);return `<div class="portfolio-dashboard"><section class="portfolio-card"><div class="portfolio-head"><div class="portfolio-title"><span class="portfolio-title-icon"><i data-lucide="file-check-2"></i></span><span><h3>Document Health</h3><div class="small">Your document portfolio at a glance</div></span></div><button class="portfolio-action" onclick="location.hash='documents'"><i data-lucide="folder-open"></i>View Documents</button></div><div class="portfolio-metrics">${health.rows.map(r=>`<div class="portfolio-metric ${r[1]}"><span class="portfolio-metric-icon"><i data-lucide="${r[2]}"></i></span><span>${r[0]}</span><b>${r[4]}</b><small>documents</small></div>`).join('')}</div><div class="portfolio-box"><div class="portfolio-subhead"><b>Portfolio Status Overview</b><span>Total Documents: ${health.total}</span></div><div class="portfolio-status-bar">${health.rows.map(r=>`<i style="width:${health.total?r[4]/health.total*100:0}%;background:${r[3]}"></i>`).join('')}</div><div class="portfolio-legend">${health.rows.map(r=>`<div><em style="background:${r[3]}"></em><span>${r[0]} (${r[4]})</span><strong>${(health.total?r[4]/health.total*100:0).toFixed(1)}%</strong></div>`).join('')}</div></div><div class="portfolio-box"><div class="portfolio-chart-head"><div class="portfolio-title"><span class="portfolio-title-icon"><i data-lucide="calendar-days"></i></span><span><b>Upcoming Expirations</b><div class="small">Next 90 days</div></span></div><button class="portfolio-action" onclick="location.hash='calendar'"><i data-lucide="calendar"></i>View Calendar</button></div><div class="portfolio-chart">${upcoming.map(r=>`<div class="portfolio-bar-column"><span>${r[1]}</span><div class="portfolio-bar-track"><i style="height:${r[1]?Math.max(r[1]/max*100,8):0}%"></i></div><small>${r[0]}</small></div>`).join('')}</div><div class="portfolio-insight"><i data-lucide="lightbulb"></i><span>${upcomingTotal} documents are expiring in the next 90 days. Take action to stay compliant.</span><button onclick="openExpirationRange90()">View Expiring Documents &rarr;</button></div></div></section><section class="portfolio-card activity-card"><div class="portfolio-head"><h3>Recent Activity</h3><button class="portfolio-action" onclick="openAllActivity()">View All Activity &rarr;</button></div><div class="portfolio-activity">${activities.slice(0,5).map(a=>{let v=portfolioActivity(a);return `<div class="portfolio-activity-row ${v[0]}"><span class="portfolio-activity-icon"><i data-lucide="${v[1]}"></i></span><b>${a.text}</b><small><i data-lucide="clock-3"></i>${a.time}</small></div>`}).join('')}</div></section></div>`}

    function company(id){let c=getOrganizationRecords('companies').find(x=>x.id==id)||getOrganizationRecords('companies')[0], docs=getOrganizationRecords('documents').filter(d=>d.company===c.name);return `${workspaceTools()}<div class="card"><div class="section-title"><h3>${c.name}</h3><button class="btn" onclick="location.hash='companies'">Back</button></div><div class="grid stats"><div class="card"><b>Contact</b><div class="small">${c.contact}<br>${c.phone}</div></div><div class="card"><b>Location</b><div class="stat-value">${c.emirate}</div></div><div class="card"><b>Branches</b><div class="stat-value">${c.branches}</div></div><div class="card"><b>Status</b><br>${badge(c.status,c.status==='Active'?'active':'soon')}</div></div><h3 style="margin-top:18px">Documents</h3>${documentMiniTable(docs.slice(0,8))}</div>`}
    function customer(id){let c=getOrganizationRecords('customers').find(x=>x.id==id)||getOrganizationRecords('customers')[0], docs=getOrganizationRecords('documents').filter(d=>d.owner===c.name);return `${workspaceTools()}<div class="card"><div class="section-title"><h3>${c.name}</h3><button class="btn" onclick="location.hash='customers'">Back</button></div><div class="grid stats"><div class="card"><b>Phone</b><div class="small">${c.phone}</div></div><div class="card"><b>Company</b><div class="small">${c.company}</div></div><div class="card"><b>Passport</b><div class="small">${c.passport}</div></div><div class="card"><b>Status</b><br>${badge('Active','active')}</div></div><h3 style="margin-top:18px">Documents</h3>${documentMiniTable(docs)}</div>`}
    function documentDetails(id){let d=getOrganizationRecords('documents').find(x=>x.id==id)||getOrganizationRecords('documents')[0], s=status(d);return `${workspaceTools()}<div class="card"><div class="section-title"><h3>${d.type}</h3><button class="btn" onclick="location.hash='documents'">Back</button></div><div class="grid stats"><div class="card"><b>Customer / Company</b><div class="small">${d.owner}<br>${d.company}</div></div><div class="card"><b>Document number</b><div class="small">${d.number}</div></div><div class="card"><b>Expiry</b><div class="small">${fmt(d.expiry)}</div></div><div class="card"><b>Status</b><br>${badge(s[0],s[1])}</div></div><div style="margin-top:16px" class="actions-cell"><button class="btn" onclick="whatsapp('${d.owner}','+971509876543','${d.type}','${fmt(d.expiry)}')">WhatsApp</button><button class="btn" onclick="toast('Call task created')">Call</button><button class="btn primary" onclick="startRenewal(${d.id})">Start Renewal</button></div></div>`}
    let headerRange='30d';
    function openSummaryCard(label){if(label==='Follow-Ups Today'){location.hash='followups';return}headerRange=label==='Expired'?'expired':label==='Expiring in 7 Days'?'7d':'30d';if(location.hash==='#renewals')render();else location.hash='renewals'}
    function renewals(){let docs=getOrganizationRecords('documents').filter(d=>{let n=daysLeft(d.expiry);return headerRange==='today'?n===0:headerRange==='7d'?n>=0&&n<=7:headerRange==='90d'?n>=0&&n<=90:headerRange==='expired'?n<0:n>=0&&n<=30}).slice(0,100);return `${workspaceTools()}<div class="card table-card"><div class="table-head"><b>Renewals</b><button class="btn primary" onclick="openModal('renewal')">Start Renewal</button></div>${documentMiniTable(docs)}</div>`}
    function calendar(){let docs=getOrganizationRecords('documents').filter(d=>daysLeft(d.expiry)>=0&&daysLeft(d.expiry)<=90).slice(0,100);return `${workspaceTools()}<div class="card"><h3>Calendar</h3><div class="activity">${docs.map(d=>`<div class="activity-item"><b>${fmt(d.expiry)} - ${d.type}</b><div class="small">${d.owner}</div></div>`).join('')}</div></div>`}
    function followups(){return `${workspaceTools()}<div class="card"><div class="section-title"><h3>Follow-Ups</h3><button class="btn primary" onclick="openModal('followup')">Add Follow-Up</button></div><div class="follow-list">${getOrganizationRecords('followUps').map(f=>followItem(f)).join('')}</div></div>`}
    function reports(){let docs=getOrganizationRecords('documents');return `${workspaceTools()}<div class="grid stats">${stat('Documents',docs.length)}${stat('Expired',docs.filter(d=>status(d)[1]==='expired').length)}${stat('Renewals',docs.filter(d=>d.renewal).length)}${stat('Follow-Ups',getOrganizationRecords('followUps').length)}</div><div class="card" style="margin-top:14px"><h3>Expiry Overview</h3>${expiryBars(docs)}</div>`}
    function settings(){let org=getCurrentOrganization(),items=['Business Profile','Branding','Reminder Preferences','Document Types','Subscription and Usage','Account and Security'];return `${workspaceTools()}<div class="grid split"><div class="card"><h3>${session.role==='Platform Admin'&&!previewOrg?'Platform Settings':'Workspace Settings'}</h3>${items.map(x=>`<div class="follow"><span><b>${x}</b><div class="small">Manage ${x.toLowerCase()}.</div></span><button class="btn small" onclick="toast('${x} opened')">Open</button></div>`).join('')}</div><div class="card"><h3>Demo data</h3><p class="small">Restore sample records for the active workspace.</p><button class="btn danger" onclick="resetOrganizationDemoData()">Reset Demo Data</button></div></div>`}

    function openModal(type){
      let fields={company:[['Company name','name'],['Industry','industry'],['Phone','phone'],['Contact person','contact']],customer:[['Full name','name'],['Phone','phone'],['Nationality','nationality'],['Company','company']],document:[['Owner','owner'],['Company','company'],['Document type','type'],['Expiry date','expiry','date']],followup:[['Customer','customer'],['Document','document'],['Time','time'],['Notes','notes']],renewal:[['Owner','owner'],['Document','document'],['Expiry date','expiry','date'],['Notes','notes']]};
      $('#modalTitle').textContent={company:'Add Company',customer:'Add Customer',document:'Add Document',followup:'Add Follow-Up',renewal:'Start Renewal'}[type]||'Quick Add';
      $('#modalBody').innerHTML=`<form id="recordForm" data-type="${type}"><div class="form-grid">${fields[type].map(f=>`<div class="field ${f[1]==='notes'?'span2':''}"><label>${f[0]}</label><input name="${f[1]}" type="${f[2]||'text'}" required></div>`).join('')}</div><div style="display:flex;justify-content:flex-end;gap:8px;margin-top:12px"><button type="button" class="btn" onclick="closeModal()">Cancel</button><button class="btn primary">Save</button></div></form>`;
      $('#modalBackdrop').classList.add('show');$('#recordForm').onsubmit=submitForm;
    }
    function quickAddMenu(){let items=[['Add Customer','customer'],['Add Company','company'],['Add Document','document'],['Add Follow-Up','followup']];$('#modalTitle').textContent='Quick Add';$('#modalBody').innerHTML=`<div class="grid" style="grid-template-columns:repeat(2,1fr)">${items.map(i=>`<button class="card" onclick="openModal('${i[1]}')" style="text-align:left"><b>${i[0]}</b></button>`).join('')}</div>`;$('#modalBackdrop').classList.add('show')}
    function submitForm(e){
      e.preventDefault();let f=Object.fromEntries(new FormData(e.target)), type=e.target.dataset.type, org=getCurrentOrganization(), t=store.tenants[org.id];
      if(type==='company')t.companies.unshift({id:Date.now(),organization_id:org.id,name:f.name,industry:f.industry,emirate:org.location,licence:'TL-DEMO',contact:f.contact,phone:f.phone,status:'Active',branches:1});
      if(type==='customer')t.customers.unshift({id:Date.now(),organization_id:org.id,name:f.name,type:'Individual',nationality:f.nationality,company:f.company,branch:'Main Office',job:'Customer',phone:f.phone,passport:'P-DEMO',eid:'784-DEMO',visa:'Employment Visa',status:'Active'});
      if(type==='document'||type==='renewal')t.documents.unshift({id:Date.now(),organization_id:org.id,owner:f.owner,company:f.company||'Individual',type:f.type||f.document,number:'DOC-DEMO',issue:dateAfter(-360),expiry:f.expiry,renewal:type==='renewal'?'Under Process':'',notes:f.notes||''});
      if(type==='followup')t.followUps.unshift({id:Date.now(),organization_id:org.id,customer:f.customer,company:'',document:f.document,time:f.time,status:'Pending',done:false});
      saveStore();closeModal();render();toast('Saved for '+org.name);
    }
    function completeFollowUp(id,done){let f=tenantData().followUps.find(x=>x.id===id);f.done=done;f.status=done?'Completed':'Pending';saveStore();render();toast(done?'Follow-up completed':'Follow-up reopened')}
    function startRenewal(id){let d=tenantData().documents.find(x=>x.id===id);d.renewal='Under Process';saveStore();location.hash='renewals';toast('Renewal started')}
    function whatsapp(name,phone,doc,expiry){let org=getCurrentOrganization(), msg=`Dear ${name.split(' ')[0]}, your ${doc} expires on ${expiry}. Please contact ${org.name} to begin renewal.`;$('#modalTitle').textContent='WhatsApp Reminder';$('#modalBody').innerHTML=`<p><b>${name}</b><br>${doc}<br>${expiry}</p><div class="field"><label>Message</label><textarea rows="5" id="waText">${msg}</textarea></div><div class="actions-cell"><button class="btn" onclick="navigator.clipboard.writeText($('#waText').value);toast('Message copied')">Copy</button><a class="btn primary" target="_blank" href="https://wa.me/${phone.replace(/\\D/g,'')}?text=${encodeURIComponent(msg)}">Open WhatsApp</a></div>`;$('#modalBackdrop').classList.add('show')}
    function notifications(){let notes=getOrganizationRecords('notifications');return `${workspaceTools()}<div class="card">${notes.map(n=>`<div class="follow"><span><b>${n.type}</b><div class="small">${n.text}</div></span><button class="btn small" onclick="openNotification(${n.id})">Open</button></div>`).join('')}</div>`}
    function openNotification(id){let n=tenantData().notifications.find(x=>x.id===id);if(n){n.read=true;saveStore();location.hash=n.target;render()}}
    function filterTable(type,q){q=q.toLowerCase();if(type==='companies')$('#companyRows').innerHTML=companyRows(getOrganizationRecords('companies').filter(x=>Object.values(x).join(' ').toLowerCase().includes(q)));if(type==='customers')$('#customerRows').innerHTML=customerRows(getOrganizationRecords('customers').filter(x=>Object.values(x).join(' ').toLowerCase().includes(q)));if(type==='documents')$('#documentTable').innerHTML=documentMiniTable(getOrganizationRecords('documents').filter(x=>Object.values(x).join(' ').toLowerCase().includes(q)).slice(0,80))}
    function closeModal(){$('#modalBackdrop').classList.remove('show')}
    function toast(text){let e=document.createElement('div');e.className='toast';e.textContent=text;$('#toasts').append(e);setTimeout(()=>e.remove(),2600)}
    function setIcons(){lucide.createIcons()}
    function showGlobalSearch(query){
      let q=query.trim().toLowerCase();if(!q)return toast('Enter a customer, company or document to search.');
      let org=getCurrentOrganization();if(org.id==='platform'){location.hash='centres';return}
      let found=[...getOrganizationRecords('companies').filter(x=>x.name.toLowerCase().includes(q)).slice(0,4).map(x=>['company',x.id,x.name]),...getOrganizationRecords('customers').filter(x=>x.name.toLowerCase().includes(q)).slice(0,4).map(x=>['customer',x.id,x.name]),...getOrganizationRecords('documents').filter(x=>(x.owner+x.type+x.number).toLowerCase().includes(q)).slice(0,4).map(x=>['document',x.id,`${x.type} - ${x.owner}`])];
      $('#modalTitle').textContent='Search results';$('#modalBody').innerHTML=found.length?`<div class="follow-list">${found.map(x=>`<button class="follow btn" onclick="closeModal();location.hash='${x[0]}/${x[1]}'">${x[2]}</button>`).join('')}</div>`:'<p class="small">No matches in this workspace.</p>';$('#modalBackdrop').classList.add('show')
    }
    window.addEventListener('message',e=>{
      if(e.origin!==location.origin||e.source!==parent)return;
      if(e.data?.type==='noteit:demo-request-state'){if(session)setChrome();return}
      if(e.data?.type!=='noteit:demo-command'||!session)return;
      let command=e.data.command;
      if(command.type==='navigate')location.hash=command.target;
      if(command.type==='filter'){headerRange=command.range;location.hash='renewals';if(location.hash==='#renewals')render()}
      if(command.type==='new')openModal(command.target);
      if(command.type==='search')showGlobalSearch(command.query||'');
      if(command.type==='logout')logout();
    });
    function bindEvents(){
      document.addEventListener('click',e=>{let b=e.target.closest('[data-page]');if(b)location.hash=b.dataset.page});
      document.addEventListener('input',e=>{if(e.target.matches('[data-filter]'))filterTable(e.target.dataset.filter,e.target.value)});
      document.addEventListener('change',e=>{if(e.target.id==='docStatus'){let val=e.target.value, docs=getOrganizationRecords('documents').filter(d=>val==='all'||status(d)[1]===val||(val==='soon'&&['soon','urgent'].includes(status(d)[1])));$('#documentTable').innerHTML=documentMiniTable(docs.slice(0,80))}});
      $('#mobileFab').onclick=quickAddMenu;$('#closeModal').onclick=closeModal;$('#modalBackdrop').onclick=e=>{if(e.target===$('#modalBackdrop'))closeModal()};
      window.onhashchange=render;document.onkeydown=e=>{if(e.key==='Escape')closeModal()}
    }
    bindEvents();setIcons();if(session)showApp();
  </script>
</body>
</html>
